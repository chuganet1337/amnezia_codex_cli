name: Shell checks

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          for script in amnezia_codex_cli_ubuntu/*.sh amnezia_codex_cli_centos_bx/*.sh; do
            bash -n "$script" || exit
          done
      - name: Test CentOS package fallback and Codex wrapper
        run: python3 -m unittest discover -s tests -v
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck amnezia_codex_cli_ubuntu/*.sh amnezia_codex_cli_centos_bx/*.sh
