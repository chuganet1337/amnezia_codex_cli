name: Shell checks

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n amnezia_codex_cli_ubuntu/*.sh amnezia_codex_cli_centos_bx/*.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck amnezia_codex_cli_ubuntu/*.sh amnezia_codex_cli_centos_bx/*.sh
